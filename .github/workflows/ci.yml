name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: yarn install --immutable
      - name: Naming guard (no 'coralstack')
        run: bash scripts/check-naming.sh
      - name: Typecheck
        run: yarn typecheck
      - name: Test
        run: yarn test:run
      - name: Lint
        run: yarn lint
      - name: Build
        run: yarn build
